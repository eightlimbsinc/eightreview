[build]
  publish = "public"
  command = "echo 'no build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The review overlay is loaded cross-page; keep it fresh while we iterate.
[[headers]]
  for = "/overlay/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

# Client portal: one link listing every page in a project.
[[redirects]]
  from = "/p/*"
  to = "/portal.html"
  status = 200
